<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildBlox - Composants Modulaires</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; line-height: 1.6; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #0056b3; margin-bottom: 10px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { display: inline-block; background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; text-decoration: none; }
    .btn:hover { background: #0056b3; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    .blox-item { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧱 BuildBlox App</h1>
      <p>Créez et assemblez vos modules web facilement.</p>
    </header>

    <section class="card">
      <h2>Nos Composants Disponibles</h2>
      <div class="grid">
        <div class="blox-item">
          <h3>Bloc Carte</h3>
          <p>Un composant visuel moderne.</p>
          <button class="btn" onclick="alert('Bloc Carte Sélectionné !')">Ajouter</button>
        </div>
        <div class="blox-item">
          <h3>Bloc Bouton</h3>
          <p>Bouton d'action interactif.</p>
          <button class="btn" onclick="alert('Bloc Bouton Sélectionné !')">Ajouter</button>
        </div>
      </div>
    </section>

    <section class="card" style="text-align: center;">
      <h2>Soutenez le Projet</h2>
      <p>Accédez aux fonctionnalités Pro prochainement.</p>
      <br>
      <button class="btn" style="background-color: #28a745;" onclick="alert('Module de paiement bientôt disponible !')">Passer à BuildBlox Pro 🚀</button>
    </section>
  </div>

</body>
</html>
