<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildBlox Games - Jeu de Mémoire</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #1a1a2e; color: #fff; text-align: center; padding: 15px; }
    header { margin-bottom: 20px; }
    h1 { color: #00d2d3; font-size: 1.8rem; }
    
    .ad-banner { background: #16213e; border: 1px dashed #00d2d3; padding: 10px; margin: 15px auto; max-width: 400px; border-radius: 8px; font-size: 0.8rem; color: #888; }
    
    .game-container { max-width: 360px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card { background: #0f3460; height: 75px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; user-select: none; transition: transform 0.2s; }
    .card.flipped { background: #e94560; transform: rotateY(180deg); }
    .card.matched { background: #2ed573; visibility: visible; }
    
    .controls { margin-top: 20px; }
    .btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn-pro { background: #ff9f43; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>🧱 BuildBlox Arcade</h1>
    <p>Trouvez toutes les paires !</p>
  </header>

  <!-- Emplacement Pub Haut -->
  <div class="ad-banner">📢 Espace Publicitaire AdSense / Monetag</div>

  <div class="game-container" id="grid"></div>

  <div class="controls">
    <button class="btn" onclick="initGame()">🔄 Recommencer</button>
    <br>
    <button class="btn btn-pro" onclick="alert('Débloquez le mode multijoueur et enlevez les pubs pour 1$ !')">👑 Passer à la version VIP</button>
  </div>

  <!-- Emplacement Pub Bas -->
  <div class="ad-banner">📢 Espace Publicitaire AdSense / Monetag</div>

  <script>
    const icons = ['🧱', '🎮', '🚀', '💎', '🧱', '🎮', '🚀', '💎'];
    let cards = [];
    let flippedCards = [];
    let matchedCount = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cards = shuffle([...icons]);
      flippedCards = [];
      matchedCount = 0;

      cards.forEach((icon, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.icon = icon;
        card.dataset.index = index;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
        card.classList.add('flipped');
        card.textContent = card.dataset.icon;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
          checkMatch();
        }
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      if (card1.dataset.icon === card2.dataset.icon) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedCount += 2;
        flippedCards = [];
        if (matchedCount === cards.length) {
          setTimeout(() => alert('Bravo ! Vous avez gagné ! 🎉'), 300);
        }
      } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          card1.textContent = '';
          card2.textContent = '';
          flippedCards = [];
        }, 800);
      }
    }

    initGame();
  </script>

</body>
</html>
